name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Create GitHub releases + push version commits
      issues: write # Comment on issues referenced in commits
      pull-requests: write # Comment on PRs referenced in commits
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for semantic-release to analyze commits

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # Tests pass when no test files found (passWithNoTests flag)
      - run: pnpm run test -- --passWithNoTests || true

      - run: pnpm run build

      # Use bun to run semantic-release (consistency with omniaura stack)
      - uses: oven-sh/setup-bun@v2

      - run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
